<!DOCTYPE html>
<html>
  <head>
    <title>Sofmyre Project</title>
    <meta charset="UTF-8">
    <meta name="keywords" content="portfolio, Jared Legault, developer, showcase, projects">
    <meta name="description" content="Come take a lot at what I've done in the past.">
    <meta name="author" content="Jared Legault">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "@hotwired/stimulus": "https://unpkg.com/@hotwired/stimulus/dist/stimulus.js"
        }
      }
    </script>

  </head>
  <body>
    <div class="top-bar d-flex justify-content-center align-items-center">
      <h1 id="name">Jared Legault</h1>
      <div>
        <a href="https://github.com/aniwhistler" target="_blank"><i class="fa-brands fa-github-alt"></i></a>
        <a href="https://www.linkedin.com/in/jared-leo-legault/" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
        <a href="https://flowcv.com/resume/i1kij3s8epsl" target="_blank"><i class="fa-solid fa-newspaper"></i></a>
      </div>
    </div>
    <div class="main-banner"></div>

    <div data-controller="event">
      <div class="centering">
        <div class="main-body-container d-flex justify-content-around">
          <button
          class="main-button"
          data-action="click->event#introclicked"
          data-event-target="ibutton"
          >
            <p class="main-button-text">Intro</p>
          </button>

          <button
          class="main-button"
          data-action="click->event#projectclicked"
          data-event-target="pbutton"
          >
            <p class="main-button-text">Project</p>
          </button>
        </div>
      </div>
      <div class="centering">
        <div class="main-body-container">
          <h1 id="center-big-text" class="text-center" data-event-target="welcome">Welcome</h1>
        </div>
      </div>
      <div class="centering">
        <div class="main-body-container d-flex justify-content-center">
          <div class="intro-card d-none" data-event-target="intro">
            <h3 class="card-title-text">A little about myself</h3>
            <p class="card-normal-text">A bit of an intro...</p>
          </div>
        </div>
      </div>
      <div class="centering">
        <div class="main-body-container d-flex justify-content-center">
          <div class="intro-card d-none" data-event-target="project">
            <h3 class="card-title-text">A project</h3>
            <p class="card-normal-text">A bit about it...</p>
          </div>
        </div>
      </div>
    </div>

    <div class="centering footer-container">
      <p>Hope you're having a lovely time </p>
      <i class="fa-regular fa-face-laugh-beam ps-2"></i>
    </div>

    <script type="module" src="index.js"></script>
  </body>

</html>
